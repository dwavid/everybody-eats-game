<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Everybody Eats!</title>
<style>
  html, body { margin: 0; height: 100%; height: 100dvh; background: #1d1424; overflow: hidden; touch-action: none; }
  html { -webkit-text-size-adjust: 100%; -webkit-touch-callout: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
  body, button { -webkit-user-select: none; user-select: none; touch-action: none; }
  canvas {
    touch-action: none; -webkit-user-drag: none;
    width: min(100vw, 177.78vh);
    width: min(100vw, 177.78dvh);
    aspect-ratio: 16 / 9;
    image-rendering: pixelated;
    background: #8fd3ff;
  }
  #controls {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: none; justify-content: space-between; align-items: flex-end;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    pointer-events: none;
  }
  @media (pointer: coarse) { #controls { display: flex; } }
  #controls .group { display: flex; gap: 20px; }
  #controls button {
    pointer-events: auto; position: relative; padding: 0;
    width: 88px; height: 88px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.75); background: rgba(255,255,255,.22);
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  #controls button::after { content: ''; position: absolute; inset: -8px; border-radius: 50%; }
  #controls svg { width: 42%; height: 42%; fill: #fff; pointer-events: none; }
  #controls button.on { background: rgba(255,255,255,.5); }
  @media (pointer: coarse) and (max-aspect-ratio: 1/1) {
    #controls { position: static; width: 100%; box-sizing: border-box; flex: none; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
    #controls button { width: min(104px, 20vw); height: min(104px, 20vw); }
    #controls .group { gap: 10px; }
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<div id="controls">
  <div class="group">
    <button data-key="left" aria-label="left"><svg viewBox="0 0 100 100"><path d="M80 8 L80 92 L12 50 Z"/></svg></button>
    <button data-key="right" aria-label="right"><svg viewBox="0 0 100 100"><path d="M20 8 L20 92 L88 50 Z"/></svg></button>
  </div>
  <div class="group">
    <button data-key="toss" aria-label="toss ladle"><svg viewBox="0 0 100 100"><circle cx="32" cy="32" r="24"/><rect x="40" y="46" width="14" height="52" rx="5" transform="rotate(-40 47 72)"/></svg></button>
    <button data-key="jump" aria-label="jump"><svg viewBox="0 0 100 100"><path d="M8 80 L92 80 L50 12 Z"/></svg></button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
